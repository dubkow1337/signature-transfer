<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Перенос подписи онлайн</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            max-width: 900px;
            width: 100%;
        }
        .upload-section {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .upload-box {
            flex: 1;
            min-width: 250px;
            border: 2px dashed #bdc3c7;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            background-color: #fafafa;
        }
        .upload-box label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #34495e;
        }
        input[type="file"] {
            display: block;
            margin: 0 auto;
        }
        .controls {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            background-color: #ecf0f1;
            padding: 15px;
            border-radius: 8px;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-weight: 600;
        }
        button:hover:not(:disabled) {
            background-color: #2980b9;
        }
        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        .canvas-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
        }
        canvas {
            border: 1px solid #ddd;
            border-radius: 4px;
            max-width: 100%;
            height: auto;
            background-color: #f9f9f9;
        }
        #status {
            margin-top: 15px;
            font-weight: 600;
            color: #e67e22;
            min-height: 24px;
        }
        .hidden { display: none; }
    </style>
    <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady();"></script>
</head>
<body>

    <h1>🖋️ Онлайн-перенос подписи</h1>

    <div class="container">
        <div class="upload-section">
            <div class="upload-box">
                <label>1. Образец подписи (светлый фон)</label>
                <input type="file" id="signInput" accept="image/*">
            </div>
            <div class="upload-box">
                <label>2. Документ для вставки</label>
                <input type="file" id="docInput" accept="image/*">
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="threshold">Порог яркости:</label>
                <input type="range" id="threshold" min="0" max="255" value="150">
                <span id="thresholdValue">150</span>
            </div>
            <div class="control-group">
                <label for="posX">Смещение X:</label>
                <input type="number" id="posX" value="50" style="width: 70px;">
            </div>
            <div class="control-group">
                <label for="posY">Смещение Y:</label>
                <input type="number" id="posY" value="50" style="width: 70px;">
            </div>
        </div>

        <button id="processBtn" disabled>✨ Перенести подпись</button>
        <button id="downloadBtn" disabled style="background-color: #27ae60; margin-left: 10px;">⬇️ Скачать результат</button>

        <div id="status">Загрузка OpenCV.js...</div>

        <div class="canvas-container">
            <div>
                <p style="text-align:center;">Исходная подпись</p>
                <canvas id="signCanvas" class="hidden"></canvas>
            </div>
            <div>
                <p style="text-align:center;">Результат</p>
                <canvas id="resultCanvas" class="hidden"></canvas>
            </div>
        </div>
    </div>

    <script>
        let cvReady = false;
        let signMat = null; // OpenCV Mat для подписи
        let docMat = null;  // OpenCV Mat для документа

        // Вызывается, когда скрипт OpenCV.js загружен
        function onOpenCvReady() {
            cv['onRuntimeInitialized'] = () => {
                cvReady = true;
                document.getElementById('status').innerText = 'OpenCV готов. Загрузите изображения.';
                checkInputs();
            };
        }

        // Проверяем, загружены ли оба файла, чтобы активировать кнопку
        function checkInputs() {
            const signFile = document.getElementById('signInput').files[0];
            const docFile = document.getElementById('docInput').files[0];
            const processBtn = document.getElementById('processBtn');
            
            if (signFile && docFile && cvReady) {
                processBtn.disabled = false;
            } else {
                processBtn.disabled = true;
            }
        }

        // Обработчик загрузки файла подписи
        document.getElementById('signInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    // Отображаем исходную подпись на маленьком canvas для предпросмотра
                    const signCanvas = document.getElementById('signCanvas');
                    signCanvas.width = img.width;
                    signCanvas.height = img.height;
                    signCanvas.getContext('2d').drawImage(img, 0, 0);
                    signCanvas.classList.remove('hidden');

                    // Загружаем в OpenCV
                    if (signMat) signMat.delete();
                    signMat = cv.imread(img);
                    checkInputs();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // Обработчик загрузки файла документа
        document.getElementById('docInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    if (docMat) docMat.delete();
                    docMat = cv.imread(img);
                    checkInputs();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // Обновление значения порога на экране
        document.getElementById('threshold').addEventListener('input', (e) => {
            document.getElementById('thresholdValue').innerText = e.target.value;
        });

        // Основная функция обработки
        document.getElementById('processBtn').addEventListener('click', () => {
            if (!signMat || !docMat) {
                alert('Пожалуйста, загрузите оба изображения.');
                return;
            }

            const statusEl = document.getElementById('status');
            statusEl.innerText = 'Обработка...';

            try {
                const thresholdVal = parseInt(document.getElementById('threshold').value);
                const posX = parseInt(document.getElementById('posX').value);
                const posY = parseInt(document.getElementById('posY').value);

                // 1. Создаём маску подписи
                let gray = new cv.Mat();
                let mask = new cv.Mat();
                let signRgba = new cv.Mat();

                // Переводим подпись в оттенки серого
                cv.cvtColor(signMat, gray, cv.COLOR_RGBA2GRAY);
                // Применяем пороговую обработку (инвертируем, чтобы штрихи стали белыми)
                cv.threshold(gray, mask, thresholdVal, 255, cv.THRESH_BINARY_INV);

                // 2. Создаём копию документа для результата
                let result = docMat.clone();

                // Проверка, чтобы подпись не выходила за границы документа
                if (posY + signMat.rows > docMat.rows || posX + signMat.cols > docMat.cols) {
                    alert('Подпись не помещается в указанные координаты. Уменьшите смещение или размер подписи.');
                    statusEl.innerText = 'Ошибка: подпись выходит за границы.';
                    gray.delete(); mask.delete(); signRgba.delete(); result.delete();
                    return;
                }

                // 3. Накладываем подпись с использованием маски
                // Создаём ROI (Region of Interest) на документе
                let roi = result.roi(new cv.Rect(posX, posY, signMat.cols, signMat.rows));
                
                // Копируем пиксели подписи в ROI только там, где маска белая
                signMat.copyTo(roi, mask);

                // 4. Отображаем результат
                cv.imshow('resultCanvas', result);
                document.getElementById('resultCanvas').classList.remove('hidden');
                document.getElementById('downloadBtn').disabled = false;

                statusEl.innerText = 'Готово! Результат можно скачать.';

                // Очистка памяти
                gray.delete();
                mask.delete();
                signRgba.delete();
                roi.delete();
                result.delete();

            } catch (err) {
                console.error(err);
                statusEl.innerText = 'Ошибка: ' + err.message;
            }
        });

        // Скачивание результата
        document.getElementById('downloadBtn').addEventListener('click', () => {
            const canvas = document.getElementById('resultCanvas');
            const link = document.createElement('a');
            link.download = 'signed_document.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
